# =============================================================================
# Example configuration for finetune_splice.py
#
# Usage:
#   python scripts/finetune_splice.py --config scripts/configs/finetune_splice_example.yaml
#
# CLI flags always override values set here.
# =============================================================================

# ---------------------------------------------------------------------------
# Single-species data
# ---------------------------------------------------------------------------

genome: /home/hd/hd_hd/hd_mf354/sds/sd17d003/Anamaria/genomes/mazin/fasta/Mus_musculus.fa
annotation_parquet: /home/hd/hd_hd/hd_mf354/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/Mus_musculus/splice_sites.parquet
usage_parquet: /home/hd/hd_hd/hd_mf354/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/Mus_musculus/usage.parquet
train_bed: /home/hd/hd_hd/hd_mf354/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/Mus_musculus/folds_100kb/FOLD_0_subset/train.bed
val_bed: /home/hd/hd_hd/hd_mf354/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/Mus_musculus/folds_100kb/FOLD_0_subset/valid.bed
organism_index: 0

# ---------------------------------------------------------------------------
# Pretrained weights
# ---------------------------------------------------------------------------
pretrained_weights: /home/hd/hd_hd/hd_mf354/projects/alphagenome_ft_pytorch/checkpoints/model_fold_0.safetensors

# ---------------------------------------------------------------------------
# Training mode: linear-probe | lora | full
# ---------------------------------------------------------------------------
mode: lora

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
sequence_length: 131072
max_sites: 1024
cache_genome: false        # set true to load genome into RAM (~12 GB for hg38)
# Set coordinate base for usage parquet
# 1 = Spliser default (1-based coordinates) — use this unless you explicitly converted to 0-based
# 0 = already converted to 0-based coordinates
usage_coord_base: 0

# ---------------------------------------------------------------------------
# Model / LoRA
# ---------------------------------------------------------------------------
dtype: bfloat16            # bfloat16 | float32
gradient_checkpointing: true

lora_rank: 8
lora_alpha: 16
lora_targets: q_proj,v_proj

# ---------------------------------------------------------------------------
# Optimiser
# ---------------------------------------------------------------------------
epochs: 20
batch_size: 2
gradient_accumulation_steps: 128   # effective batch = batch_size * accum * gpus
lr: 1.0e-4
weight_decay: 0.1
warmup_steps: 1000
lr_schedule: cosine              # cosine | constant

# Loss weights
cls_weight: 1.0
usage_weight: 1.0
max_grad_norm: 1.0             # gradient clipping (0 to disable)

# ---------------------------------------------------------------------------
# Performance
# ---------------------------------------------------------------------------
num_workers: 6
use_amp: true              # set false to disable AMP
compile: true              # torch.compile for fused kernels

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
wandb: false
wandb_project: alphagenome-splice
# wandb_entity: my-team
log_every: 10

# ---------------------------------------------------------------------------
# Output / checkpointing
# ---------------------------------------------------------------------------
output_dir: /home/hd/hd_hd/hd_mf354/sds/sd17d003/Anamaria/alphagenome_genomicsxai/
run_name: 132kb_mouse_lora           # defaults to timestamp
save_every: 1

# Resume: path to checkpoint, or "auto" to find latest in output_dir
# resume: auto

# ---------------------------------------------------------------------------
# Reproducibility
# ---------------------------------------------------------------------------
seed: 1950
