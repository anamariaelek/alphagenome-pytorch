# =============================================================================
# Full fine-tuning (all ~495M parameters, no LoRA) counterpart of
# hqmrboc_132kb_junctions.yaml: same 7 species, data, loss weights
# (bce 1 / delta_mse 5 / trajectory_pearson 5 / tissue_contrast 5) and junction
# loss. Only the training mode and optimiser settings differ:
#   - mode: full; lora_* / train_components are ignored and removed here
#   - batch 3 x accumulation 64 = effective 192, the same as the junction LoRA run
#     (lora_64_emb_traj_tiss_jx_hqmrboc_132kb was run with batch 3 x 64)
#   - lr 2e-5 (all weights move, vs 1e-4 for LoRA adapters), warmup 500 steps
#   - 8 epochs: cosine decays to 0 at the end of epoch 8 (~5.5k optimizer steps)
#
# Resources (measured trunk memory on a 3090 + the junction LoRA run's timings):
#   GPU memory ~9 GiB static (fp32 weights + grads + AdamW) + ~9-15 GiB/sample
#   -> ~40-55 GiB at batch 3. Use H100 80GB or H200.
#   ~1.6-1.8x the LoRA time per batch -> ~15-18 h per epoch on one H100/H200.
#   Checkpoints ~6 GB each (weights + AdamW state).
#
# HoreKa 2 (AG_CLUSTER=horeka2):
#   slurm/stage_inputs.sh configs/hqmrboc_132kb_junctions_full.yaml
#   slurm/submit.sh --partition gpu-h200 --mem 64G --cpus 8 --time 48:00:00 \
#       finetune_splice configs/hqmrboc_132kb_junctions_full.yaml
#   (resume: auto, so resubmitting the same command continues from the last epoch)
#
# CLI flags always override values set here.
# =============================================================================

# ---------------------------------------------------------------------------
# Multi-species data
# ---------------------------------------------------------------------------
# When 'species' is present, per-species datasets are created and combined.
# Each species may have a different usage_parquet (or none at all).
# SpeciesGroupedSampler guarantees every batch is single-species, so
# n_conditions can differ freely between organisms.

species:
  - name: human
    genome: $HOME/sds/sd17d003/Anamaria/genomes/ensembl115/fasta/Homo_sapiens.fa
    annotation_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Homo_sapiens/splice_sites_intersect_usage_protein_coding.parquet
    usage_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Homo_sapiens/usage.parquet
    junction_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Homo_sapiens/junctions.parquet
    train_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/human/fold0/train.bed
    val_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/human/fold0/valid.bed
    organism_index: 0

  - name: mouse
    genome: $HOME/sds/sd17d003/Anamaria/genomes/mazin/fasta/Mus_musculus.fa
    annotation_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Mus_musculus/splice_sites_intersect_usage_protein_coding.parquet
    usage_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Mus_musculus/usage.parquet
    junction_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Mus_musculus/junctions.parquet
    train_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/mouse/fold0/train.bed
    val_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/mouse/fold0/valid.bed
    organism_index: 1

  - name: rat
    genome: $HOME/sds/sd17d003/Anamaria/genomes/mazin/fasta/Rattus_norvegicus.fa
    annotation_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Rattus_norvegicus/splice_sites_intersect_usage_protein_coding.parquet
    usage_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Rattus_norvegicus/usage.parquet
    junction_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Rattus_norvegicus/junctions.parquet
    train_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/rat/fold0/train.bed
    val_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/rat/fold0/valid.bed
    organism_index: 2
  
  - name: rabbit
    genome: $HOME/sds/sd17d003/Anamaria/genomes/mazin/fasta/Oryctolagus_cuniculus.fa
    annotation_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Oryctolagus_cuniculus/splice_sites_intersect_usage_protein_coding.parquet
    usage_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Oryctolagus_cuniculus/usage.parquet
    junction_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Oryctolagus_cuniculus/junctions.parquet
    train_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/rabbit/fold0/train.bed
    val_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/rabbit/fold0/valid.bed
    organism_index: 3
  
  - name: opossum
    genome: $HOME/sds/sd17d003/Anamaria/genomes/mazin/fasta/Monodelphis_domestica.fa
    annotation_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Monodelphis_domestica/splice_sites_intersect_usage_protein_coding.parquet
    usage_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Monodelphis_domestica/usage.parquet
    junction_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Monodelphis_domestica/junctions.parquet
    train_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/opossum/fold0/train.bed
    val_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/opossum/fold0/valid.bed
    organism_index: 4

  - name: macaque
    genome: $HOME/sds/sd17d003/Anamaria/genomes/ensembl115/fasta/Macaca_mulatta.fa
    annotation_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Macaca_mulatta/splice_sites_intersect_usage_protein_coding.parquet
    usage_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Macaca_mulatta/usage.parquet
    junction_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Macaca_mulatta/junctions.parquet
    train_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/macaque/fold0/train.bed
    val_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/macaque/fold0/valid.bed
    organism_index: 5
    
  - name: chicken
    genome: $HOME/sds/sd17d003/Anamaria/genomes/mazin/fasta/Gallus_gallus.fa
    annotation_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Gallus_gallus/splice_sites_intersect_usage_protein_coding.parquet
    usage_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Gallus_gallus/usage.parquet
    junction_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/cardoso_moreira/Gallus_gallus/junctions.parquet
    train_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/chicken/fold0/train.bed
    val_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/chicken/fold0/valid.bed
    organism_index: 6

organism_embedding_init:
  0: 0   # new organism 0 from pretrained organism 0
  1: 1   # new organism 1 from pretrained organism 1
  2: 1   # new organism 2 from pretrained organism 1
  3: 1   # new organism 3 from pretrained organism 1
  4: 1   # new organism 4 from pretrained organism 1
  5: 0   # new organism 5 from pretrained organism 0
  6: 1   # new organism 6 from pretrained organism 1

# ---------------------------------------------------------------------------
# Pretrained weights
# ---------------------------------------------------------------------------
pretrained_weights: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai_code/checkpoints/model_fold_0.safetensors

# ---------------------------------------------------------------------------
# Training mode: linear-probe | lora | full
# ---------------------------------------------------------------------------
mode: full

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
sequence_length: 131072    # used lengths: 131072 196608 524288
max_sites: 1024
cache_genome: false        # false (default): lazy on-demand FASTA reads (fast startup, low RAM). true: load whole genome into RAM (~12 GB for hg38; slow startup)
# Set coordinate base for usage parquet
# 1 = Spliser default (1-based coordinates) — use this unless you explicitly converted to 0-based
# 0 = already converted to 0-based coordinates
usage_coord_base: 0

# observed_conditions_only: false (default) means unobserved conditions are treated as 0 and included in loss
# observed_conditions_only: true means only compute loss for:
#     1) observed conditions in tissues with at least one observed timepoint, and
#     2) all conditions in tissues with no observed timepoints (treating them as 0)
observed_conditions_only: true

# Balance the training sampler: cyclically resample smaller species (rabbit, chicken
# currently have ~40% fewer windows than human/mouse/rat/opossum) up to the largest
# species' window count, so every species gets the same number of batches/gradient
# updates per epoch. Validation sampler is left unbalanced (per-species eval metrics
# stay representative of the true data distribution).
oversample_species: true

# ---------------------------------------------------------------------------
# Model / LoRA
# ---------------------------------------------------------------------------
dtype: bfloat16            # bfloat16 | float32
gradient_checkpointing: true

train_species_embeddings: true

# mode: full trains every parameter, so no lora_* / train_components here.

# ---------------------------------------------------------------------------
# Optimiser
# ---------------------------------------------------------------------------
epochs: 8                        # cosine schedule length; changing it mid-run reshapes the LR curve
batch_size: 3
gradient_accumulation_steps: 64   # effective batch = batch_size * accum * gpus = 192
lr: 2.0e-5
weight_decay: 0.1
warmup_steps: 500
lr_schedule: cosine              # cosine | constant

# Loss weights
cls_weight: 1.0
usage_weight: 1.0

# Dictionary of usage loss component weights. Trajectory terms are computed PER-TISSUE
# over that tissue's developmental timepoints (not all conditions concatenated), so they
# capture within-tissue dynamics rather than tissue-level offsets.
#   bce:                BCE on absolute usage (level), summed independently over every
#                       real biological replicate observation (not a single collapsed
#                       value per site/condition), coverage-weighted by each replicate's
#                       own Alpha+Beta read count when available (equivalent to the
#                       correct Binomial log-likelihood).
#   delta_mse:          per-(site,tissue) centered MSE (trajectory magnitude), restricted
#                       to sites that clear the exc5 excursion filter (genuinely dynamic,
#                       not flat/noisy/an outlier timepoint); equal-weighted across sites.
#   trajectory_pearson: 1 - PearsonR per (site,tissue) (trajectory direction), same exc5
#                       filter as delta_mse.
#   tissue_contrast:    per-(site,tissue) one-vs-rest usage contrast -- own-tissue mean
#                       usage vs. the mean pooled across every other tissue, restricted to
#                       genuine one-vs-rest markers (true contrast > marker_floor=0.25);
#                       addresses splicing_specificity_eval/report.md's "Differential
#                       tissue usage" finding that marker-site predictions are compressed
#                       toward the middle instead of sharply elevated in their own tissue.
# train_usage_trajectory_corr (per-tissue temporal Pearson) is logged regardless of weights.
# tissue_contrast is NOT part of the usage_traj_warmup_epochs ramp below (always at full
# weight from epoch 1, like bce) -- only delta_mse/trajectory_pearson are ramped.
usage_loss_weights:
  bce: 1.0
  delta_mse: 5.0
  trajectory_pearson: 5.0
  tissue_contrast: 5.0

# BCE-only warm-up. The per-tissue traj_r / train_usage_trajectory_corr is still logged during warm-up.
usage_traj_warmup_epochs: 1

# ---------------------------------------------------------------------------
# Splice junctions (see "Junction loss" in WORKFLOW_FINETUNING_SPLICING.md)
# ---------------------------------------------------------------------------
# Species without junction_parquet get no junction head; their batches train
# classification + usage only. Macaque's usage/junctions keep the 28 conditions of the
# August usage file (Liver_15 has no data yet).
junction_weight: 1.0
max_junction_sites: 256        # sites per list (donor+, acceptor+, donor-, acceptor-) per window
junction_count_norm: cpm       # per-sample CPM, clip at 99.99th pct, typical non-zero ~1
junction_replicate_agg: mean   # mean | sum over a condition's samples
junction_init_metadata:        # pretrained organism -> track metadata, for tissue-matched init
  0: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/alphagenome_metadata_homo_sapiens.csv
  1: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/alphagenome_metadata_mus_musculus.csv

# Gradient clipping (0 to disable)
max_grad_norm: 1.0 

# ---------------------------------------------------------------------------
# Performance
# ---------------------------------------------------------------------------
num_workers: 2             # Reduced to 2 to minimize RAM usage from worker processes
use_amp: true              # set false to disable AMP
compile: true              # torch.compile for fused kernels
# Fraction of GPU memory this process may use (1.0 = no cap). Set <1.0 to leave
# headroom or share the GPU (applies torch.cuda.set_per_process_memory_fraction).
cuda_memory_fraction: 1.0

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
wandb: false
wandb_project: alphagenome-splice
# wandb_entity: my-team
log_every: 10

# ---------------------------------------------------------------------------
# Output / checkpoin1ting
# ---------------------------------------------------------------------------
output_dir: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/models/
run_name: full_emb_traj_tiss_jx_hqmrboc_132kb      # defaults to timestamp
save_every: 1

# Resume: path to checkpoint, or "auto" to find latest in output_dir
resume: auto

# ---------------------------------------------------------------------------
# Reproducibility
# ---------------------------------------------------------------------------
seed: 1950
