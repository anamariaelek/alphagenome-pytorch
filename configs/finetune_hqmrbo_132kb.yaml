# =============================================================================
# Example configuration for finetune_splice.py
#
# Usage:
#   python scripts/finetune_splice.py --config scripts/configs/finetune_splice_example.yaml
#
# CLI flags always override values set here.
# =============================================================================

# ---------------------------------------------------------------------------
# Multi-species data
# ---------------------------------------------------------------------------
# When 'species' is present, per-species datasets are created and combined.
# Each species may have a different usage_parquet (or none at all).
# SpeciesGroupedSampler guarantees every batch is single-species, so
# n_conditions can differ freely between organisms.

species:
  - name: human
    genome: $HOME/sds/sd17d003/Anamaria/genomes/ensembl115/fasta/Homo_sapiens.fa
    annotation_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/Homo_sapiens/splice_sites_intersect_usage_protein_coding.parquet
    usage_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/Homo_sapiens/usage.parquet
    train_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/human/fold0/train.bed
    val_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/human/fold0/valid.bed
    organism_index: 0

  - name: mouse
    genome: $HOME/sds/sd17d003/Anamaria/genomes/mazin/fasta/Mus_musculus.fa
    annotation_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/Mus_musculus/splice_sites_intersect_usage_protein_coding.parquet
    usage_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/Mus_musculus/usage.parquet
    train_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/mouse/fold0/train.bed
    val_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/mouse/fold0/valid.bed
    organism_index: 1

  - name: rat
    genome: $HOME/sds/sd17d003/Anamaria/genomes/mazin/fasta/Rattus_norvegicus.fa
    annotation_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/Rattus_norvegicus/splice_sites_intersect_usage_protein_coding.parquet
    usage_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/Rattus_norvegicus/usage.parquet
    train_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/rat/fold0/train.bed
    val_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/rat/fold0/valid.bed
    organism_index: 2
  
  - name: rabbit
    genome: $HOME/sds/sd17d003/Anamaria/genomes/mazin/fasta/Oryctolagus_cuniculus.fa
    annotation_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/Oryctolagus_cuniculus/splice_sites_intersect_usage_protein_coding.parquet
    usage_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/Oryctolagus_cuniculus/usage.parquet
    train_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/rabbit/fold0/train.bed
    val_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/rabbit/fold0/valid.bed
    organism_index: 3
  
  - name: opossum
    genome: $HOME/sds/sd17d003/Anamaria/genomes/mazin/fasta/Monodelphis_domestica.fa
    annotation_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/Monodelphis_domestica/splice_sites_intersect_usage_protein_coding.parquet
    usage_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/Monodelphis_domestica/usage.parquet
    train_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/opossum/fold0/train.bed
    val_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/opossum/fold0/valid.bed
    organism_index: 4

species:
  - name: macaque
    genome: $HOME/sds/sd17d003/Anamaria/genomes/ensembl115/fasta/Macaca_mulatta.fa
    annotation_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/Macaca_mulatta/splice_sites_intersect_usage_protein_coding.parquet
    usage_parquet: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/data/Macaca_mulatta/usage.parquet
    train_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/macaque/fold0/train.bed
    val_bed: $HOME/sds/sd17d003/Anamaria/borzoi_folds/results_orthologs_132kb_protein_coding/macaque/fold0/valid.bed
    organism_index: 5

organism_embedding_init:
  0: 0   # new organism 0 from pretrained organism 0
  1: 1   # new organism 1 from pretrained organism 1
  2: 1   # new organism 2 from pretrained organism 1
  3: 1   # new organism 3 from pretrained organism 1
  4: 1   # new organism 4 from pretrained organism 1
  5: 0   # new organism 5 from pretrained organism 0

# ---------------------------------------------------------------------------
# Pretrained weights
# ---------------------------------------------------------------------------
pretrained_weights: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai_code/checkpoints/model_fold_0.safetensors

# ---------------------------------------------------------------------------
# Training mode: linear-probe | lora | full
# ---------------------------------------------------------------------------
mode: lora

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
sequence_length: 131072    # used lengths: 131072 196608 524288
max_sites: 1024
cache_genome: false        # false (default): lazy on-demand FASTA reads (fast startup, low RAM). true: load whole genome into RAM (~12 GB for hg38; slow startup)
# Set coordinate base for usage parquet
# 1 = Spliser default (1-based coordinates) — use this unless you explicitly converted to 0-based
# 0 = already converted to 0-based coordinates
usage_coord_base: 0

# observed_conditions_only: false (default) means unobserved conditions are treated as 0 and included in loss
# observed_conditions_only: true means only compute loss for:
#     1) observed conditions in tissues with at least one observed timepoint, and
#     2) all conditions in tissues with no observed timepoints (treating them as 0)
observed_conditions_only: true

# ---------------------------------------------------------------------------
# Model / LoRA
# ---------------------------------------------------------------------------
dtype: bfloat16            # bfloat16 | float32
gradient_checkpointing: true

train_species_embeddings: true

lora_rank: 32
lora_alpha: 64
lora_targets: q_proj,v_proj

# Additional components to fully fine-tune on top of whatever 'mode' already
# trains (splice heads, LoRA-adapted attention, species embeddings above).
# Comma-separated, ignored in 'mode: full' (everything is already trainable).
# Valid names: encoder, tower, decoder, embedder_128bp, embedder_1bp,
# embedder_pair, organism_embed
#train_components: tower,embedder_1bp,embedder_128bp

# ---------------------------------------------------------------------------
# Optimiser
# ---------------------------------------------------------------------------
epochs: 20
batch_size: 4
gradient_accumulation_steps: 32   # effective batch = batch_size * accum * gpus
lr: 1.0e-4
weight_decay: 0.1
warmup_steps: 1000
lr_schedule: cosine              # cosine | constant

# Loss weights
cls_weight: 1.0
usage_weight: 1.0

# Dictionary of usage loss component weights. Trajectory terms are computed PER-TISSUE
# over that tissue's developmental timepoints (not all conditions concatenated), so they
# capture within-tissue dynamics rather than tissue-level offsets.
#   bce:                BCE on absolute usage (level) -- every observed site.
#   delta_mse:          per-(site,tissue) centered MSE (trajectory magnitude), restricted
#                       to sites that clear the exc5 excursion filter (genuinely dynamic,
#                       not flat/noisy/an outlier timepoint); equal-weighted across sites.
#   trajectory_pearson: 1 - PearsonR per (site,tissue) (trajectory direction), same exc5
#                       filter as delta_mse.
# train_usage_trajectory_corr (per-tissue temporal Pearson) is logged regardless of weights.
usage_loss_weights:
  bce: 1.0
  delta_mse: 1.0
  trajectory_pearson: 0.0

# BCE-only warm-up: for the first N epochs (1-indexed) the delta_mse/trajectory_pearson
# terms are DISABLED (pure BCE); they switch on at full strength from epoch N+1.
# N=2 -> epochs 1-2 BCE only, trajectory terms from epoch 3. 0 = no warm-up. The per-tissue
# Pearson (traj_r / train_usage_trajectory_corr) is still logged during warm-up.
usage_traj_warmup_epochs: 2

# Gradient clipping (0 to disable)
max_grad_norm: 1.0 

# ---------------------------------------------------------------------------
# Performance
# ---------------------------------------------------------------------------
num_workers: 2             # Reduced to 2 to minimize RAM usage from worker processes
use_amp: true              # set false to disable AMP
compile: true              # torch.compile for fused kernels
# Fraction of GPU memory this process may use (1.0 = no cap). Set <1.0 to leave
# headroom or share the GPU (applies torch.cuda.set_per_process_memory_fraction).
cuda_memory_fraction: 1.0

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
wandb: false
wandb_project: alphagenome-splice
# wandb_entity: my-team
log_every: 10

# ---------------------------------------------------------------------------
# Output / checkpoin1ting
# ---------------------------------------------------------------------------
output_dir: $HOME/sds/sd17d003/Anamaria/alphagenome_genomicsxai/
run_name: lora_32_traj_human_macaque_mouse_rat_rabbit_opossum        # defaults to timestamp
save_every: 1

# Resume: path to checkpoint, or "auto" to find latest in output_dir
resume: auto

# ---------------------------------------------------------------------------
# Reproducibility
# ---------------------------------------------------------------------------
seed: 1950
